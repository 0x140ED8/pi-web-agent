<!doctype html>
<html lang="zh-CN" data-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#f1f1ee" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)" />
		<title>Pi Agent Web</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
			rel="stylesheet"
		/>
		<script>
			(function () {
				try {
					var theme = localStorage.getItem("pi-agent-web:theme");
					if (!theme) {
						theme =
							window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
								? "light"
								: "dark";
					}
					document.documentElement.setAttribute("data-theme", theme);
					var lang = localStorage.getItem("pi-agent-web:lang");
					if (lang) document.documentElement.setAttribute("lang", lang);
				} catch (e) {
					/* ignore */
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
