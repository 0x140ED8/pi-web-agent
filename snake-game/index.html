<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 - Snake Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <h1>贪吃蛇</h1>
    <div class="hud">
      <div class="score-box">得分 <span id="score">0</span></div>
      <div class="score-box">最高 <span id="best">0</span></div>
    </div>
    <div class="stage">
      <canvas id="game" width="480" height="480"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ov-title">准备开始</h2>
        <p id="ov-text">使用方向键 ↑ ↓ ← → 控制蛇的移动</p>
        <button id="ov-btn">开始游戏</button>
      </div>
    </div>
    <p class="tip">方向键控制 · 空格暂停/继续 · R 重新开始</p>
  </div>
  <script src="game.js"></script>
</body>
</html>
